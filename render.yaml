databases:
  - name: real-estate-db
    databaseName: real_estate
    user: realestate_user
    plan: free
    region: oregon

services:
  # ─── Spring Boot Backend ─────────────────────────────────────────────────────
  - type: web
    name: real-estate-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Database — populated automatically from the linked free PostgreSQL instance
      - key: DB_HOST
        fromDatabase:
          name: real-estate-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: real-estate-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: real-estate-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: real-estate-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: real-estate-db
          property: password
      # JWT secret — Render generates a unique secure value at Blueprint creation
      - key: JWT_SECRET
        generateValue: true
      # CORS allowed origin — set to the actual frontend hostname Render assigns.
      # Render's fromService returns a bare hostname (no protocol); SecurityConfig
      # is updated to handle both bare hostname and full https:// URL formats.
      - key: FRONTEND_ORIGIN
        fromService:
          name: real-estate-frontend
          type: web
          property: host

  # ─── Next.js Frontend ────────────────────────────────────────────────────────
  - type: web
    name: real-estate-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    envVars:
      # Backend hostname for the Next.js runtime proxy (src/proxy.js).
      # Render fromService gives a bare slug/hostname; src/proxy.js prepends https://.
      - key: BACKEND_URL
        fromService:
          name: real-estate-backend
          type: web
          property: host
