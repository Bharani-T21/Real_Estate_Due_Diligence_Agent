databases:
  - name: real-estate-db
    databaseName: real_estate
    user: realestate_user
    plan: free
    region: oregon

services:
  # Spring Boot Backend
  - type: web
    name: real-estate-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: real-estate-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: real-estate-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: real-estate-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: real-estate-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: real-estate-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://real-estate-frontend.onrender.com

  # Next.js Frontend
  - type: web
    name: real-estate-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    envVars:
      - key: BACKEND_URL
        fromService:
          name: real-estate-backend
          type: web
          property: host
          envVarKey: BACKEND_URL
