spring.application.name=real-estate-due-diligence-agent

# Datasource Configuration (H2 in-memory by default for local dev, or PostgreSQL when SPRING_DATASOURCE_URL is set)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:real_estate_db;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# SQL Initialization Settings (Hibernate handles schema auto-creation via ddl-auto=update)
spring.sql.init.mode=never

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdEZXZlbG9wbWVudFNlY3JldEtleUZvckhTMjU2}
app.jwt.expiration-ms=86400000
