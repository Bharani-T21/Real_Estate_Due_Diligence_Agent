spring.application.name=real-estate-due-diligence-agent
# Render injects PORT at runtime; fall back to 8080 for local
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:real_estate_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.h2.console.enabled=false
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdEZXZlbG9wbWVudFNlY3JldEtleUZvckhTMjU2}
app.jwt.expiration-ms=86400000
